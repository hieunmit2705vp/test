# ============================================================
# docker-compose dành cho VPS - dùng image có sẵn (không build)
# Copy file này lên VPS cùng với 2 file .tar
# ============================================================
services:
  backend:
    image: cnpm_backend:latest
    container_name: cnpm_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-app:3306/${DB_NAME:-testdb}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    networks:
      - codelo-network

  frontend:
    image: cnpm_frontend:latest
    container_name: cnpm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - codelo-network

networks:
  codelo-network:
    external: true
